name: CI

on:
  push:
    branches:
      - revamp/astro
      - main
  pull_request:

jobs:
  verify:
    name: Verify (Node 22.23.4)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.23.4
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Astro check
        run: pnpm astro check

      - name: Svelte check
        run: pnpm exec svelte-check --tsconfig ./tsconfig.json

      - name: TypeScript
        run: pnpm exec tsc --noEmit

      - name: ESLint
        run: pnpm lint

      - name: Build (Astro + Pagefind + CV PDF)
        run: pnpm build

      - name: Claim ledgers
        run: node scripts/check-claims.mjs

      - name: SEO contract
        run: node scripts/check-seo.mjs

      - name: CV PDF hash
        run: pnpm exec tsx scripts/check-cv-pdf.ts

      - name: Token parity
        run: node scripts/check-tokens.mjs

      - name: Contrast parity
        run: node scripts/check-contrast.mjs

      - name: Primitive parity
        run: node scripts/check-primitives.mjs

      - name: Unit tests
        run: pnpm exec vitest run --passWithNoTests

      - name: Playwright (chromium, no-js, axe)
        run: pnpm exec playwright test
