name: CI

on:
  push:
    branches:
      - revamp/astro
      - main
  pull_request:

jobs:
  verify:
    name: Verify (Node 22.23.4)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    # `astro.config.mjs` fails a CI build whose canonical origin is localhost.
    # CI artifacts are never deployed, so a reserved `.invalid` origin is the
    # fallback; the repository variable carries the real origin when set.
    env:
      SITE_URL: ${{ vars.SITE_URL || 'https://ci.invalid' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.23.4
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Astro check
        run: pnpm astro check

      - name: Svelte check
        run: pnpm exec svelte-check --tsconfig ./tsconfig.json

      - name: TypeScript
        run: pnpm exec tsc --noEmit

      - name: ESLint
        run: pnpm lint

      - name: Build (Astro + Pagefind)
        run: pnpm build

      # Builds are read-only with respect to the tree (review pass 1, M1):
      # everything a build produces belongs under dist/ (or another ignored
      # path). A tracked file or an untracked stray means a build wrote state.
      - name: Builds never write to the tree
        run: git diff --exit-code && test -z "$(git status --porcelain)"

      # The production build must not contain the design-system route (G0).
      - name: Production build excludes /dev routes
        run: test ! -f dist/dev/design/index.html

      # Pagefind runs inside `pnpm build`; prove the index it emitted is usable
      # instead of shipping a search box that returns nothing.
      - name: Pagefind index is usable
        run: node scripts/check-pagefind.mjs

      # The CV PDF is rendered by Chromium, which is not available on the
      # Vercel build image. Generation therefore lives here (plan.md:182, "CI
      # renders the PDF from the same structured source"); `pnpm build` — the
      # Vercel buildCommand — must not call playwright.
      - name: Generate CV PDF (CI-only Chromium render)
        run: pnpm exec tsx scripts/generate-cv-pdf.ts

      - name: Upload CV PDF
        uses: actions/upload-artifact@v4
        with:
          name: cv-pdf
          path: dist/cv/tapia-resume.pdf
          if-no-files-found: error

      - name: Claim ledgers
        run: node scripts/check-claims.mjs

      - name: SEO contract
        run: node scripts/check-seo.mjs

      - name: CV PDF hash
        run: pnpm exec tsx scripts/check-cv-pdf.ts

      - name: JS artifact budgets (G6)
        run: node scripts/check-js-budget.mjs

      - name: DOM link + anchor check (G4/G6)
        run: node scripts/check-links.mjs

      - name: Token parity
        run: node scripts/check-tokens.mjs

      - name: Contrast parity
        run: node scripts/check-contrast.mjs

      - name: Primitive parity
        run: node scripts/check-primitives.mjs

      # Gate G3: intro audio + paint contract (needs the built dist/ and a
      # real Chromium audio graph).
      - name: Intro audio + paint contract (G3)
        run: pnpm check:g3

      # Gate G5 monitoring. Both run only when the repository variable exists;
      # before the first deploy they are skipped, so CI cannot go red for a
      # missing URL. Each script also self-skips when its URL is unset.
      - name: Build-id heartbeat (skip without DEPLOY_URL/SITE_URL)
        if: ${{ vars.DEPLOY_URL != '' || vars.SITE_URL != '' }}
        env:
          DEPLOY_URL: ${{ vars.DEPLOY_URL }}
          SITE_URL: ${{ vars.SITE_URL }}
        run: node scripts/check-heartbeat.mjs

      - name: Contact endpoint drill (skip without CONTACT_ENDPOINT)
        if: ${{ vars.CONTACT_ENDPOINT != '' }}
        env:
          CONTACT_ENDPOINT: ${{ vars.CONTACT_ENDPOINT }}
        run: node scripts/check-contact.mjs

      - name: Unit tests
        run: pnpm exec vitest run --passWithNoTests

      # G6 performance budgets (mobile, fixed profile in lighthouserc.json).
      # Every URL carries ?measure=1 so the intro overlay never becomes LCP.
      - name: Lighthouse CI (mobile budgets, intro skipped)
        run: |
          export CHROME_PATH="$(node --input-type=module -e "import { chromium } from 'playwright'; console.log(chromium.executablePath())")"
          pnpm exec lhci autorun

      - name: Playwright (chromium, no-js, axe)
        run: pnpm exec playwright test
